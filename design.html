<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Aventura MX Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 350px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Logo personalizado */
        .logo {
            width: 40px;
            height: 40px;
            background: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMjAiIGZpbGw9IiNGRjAwMDAiLz4KPHRleHQgeD0iMjAiIHk9IjI0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1zaXplPSIxMCIgZm9udC13ZWlnaHQ9ImJvbGQiPkFNWDwvdGV4dD4KPC9zdmc+') center/cover;
            position: absolute;
            top: 15px;
            right: 15px;
            border-radius: 50%;
        }

        /* Album Art con animaciones */
        .album-art-container {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            position: relative;
        }

        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            position: relative;
            overflow: hidden;
            animation: gradientMove 3s ease-in-out infinite;
        }

        .album-art.playing {
            animation: rotate 10s linear infinite, gradientMove 3s ease-in-out infinite;
        }

        .sound-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        .wave {
            width: 4px;
            background: white;
            border-radius: 2px;
            opacity: 0.8;
        }

        .wave:nth-child(1) { height: 10px; animation: wave 1.2s ease-in-out infinite; }
        .wave:nth-child(2) { height: 20px; animation: wave 1.2s ease-in-out infinite 0.1s; }
        .wave:nth-child(3) { height: 30px; animation: wave 1.2s ease-in-out infinite 0.2s; }
        .wave:nth-child(4) { height: 20px; animation: wave 1.2s ease-in-out infinite 0.3s; }
        .wave:nth-child(5) { height: 15px; animation: wave 1.2s ease-in-out infinite 0.4s; }

        /* Metadatos */
        .metadata {
            margin: 20px 0;
        }

        .station-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .current-song {
            font-size: 14px;
            color: #666;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-dj {
            font-size: 12px;
            color: #999;
            font-style: italic;
        }

        /* Controles principales */
        .main-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .play-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
            position: relative;
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }

        .volume-btn, .equalizer-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #f8f9fa;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .volume-btn:hover, .equalizer-btn:hover {
            background: #e9ecef;
            transform: scale(1.1);
        }

        /* Control de volumen */
        .volume-control {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ff6b6b;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Panel del ecualizador */
        .equalizer-panel {
            display: none;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .equalizer-panel.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .equalizer-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .animation-controls {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .animation-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e9ecef;
        }

        .animation-btn.active {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        /* Status indicator */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #dc3545;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .player-container {
                margin: 10px;
                padding: 20px;
            }
            
            .album-art-container {
                width: 160px;
                height: 160px;
            }
        }

        /* Animaciones */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efectos especiales */
        .ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 2s linear infinite;
            display: none;
        }

        .album-art.playing .ripple {
            display: block;
        }

        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="logo"></div>
        
        <div class="album-art-container">
            <div class="album-art" id="albumArt">
                <div class="sound-waves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
                <div class="ripple"></div>
            </div>
        </div>

        <div class="metadata">
            <div class="station-name">Radio Aventura MX</div>
            <div class="current-song" id="currentSong">Cargando información...</div>
            <div class="current-dj" id="currentDJ">Conectando...</div>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">En línea</span>
            </div>
        </div>

        <div class="main-controls">
            <button class="volume-btn" id="volumeBtn">🔊</button>
            <button class="play-button" id="playButton">▶️</button>
            <button class="equalizer-btn" id="equalizerBtn">🎛️</button>
        </div>

        <div class="volume-control">
            <span>🔇</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            <span>🔊</span>
        </div>

        <div class="equalizer-panel" id="equalizerPanel">
            <div class="equalizer-title">Efectos Visuales - Radio Aventura MX</div>
            <div class="animation-controls">
                <button class="animation-btn active" data-animation="gradient">Gradiente</button>
                <button class="animation-btn" data-animation="pulse">Pulso</button>
                <button class="animation-btn" data-animation="wave">Ondas</button>
                <button class="animation-btn" data-animation="disco">Disco</button>
            </div>
            <div style="margin-top: 15px; font-size: 11px; color: #999; text-align: center;">
                ¡Próximamente más funciones!
            </div>
        </div>
    </div>

    <script>
        class RadioPlayer {
            constructor() {
                this.audio = new Audio();
                this.isPlaying = false;
                this.currentAnimation = 'gradient';
                this.streamUrl = 'https://radios.blumhost.es:8218/stream';
                
                this.initializePlayer();
                this.bindEvents();
                this.startMetadataFetch();
            }

            initializePlayer() {
                this.audio.src = this.streamUrl;
                this.audio.crossOrigin = "anonymous";
                this.audio.volume = 0.7;
                
                // Elementos DOM
                this.playButton = document.getElementById('playButton');
                this.volumeSlider = document.getElementById('volumeSlider');
                this.albumArt = document.getElementById('albumArt');
                this.equalizerPanel = document.getElementById('equalizerPanel');
                this.currentSong = document.getElementById('currentSong');
                this.currentDJ = document.getElementById('currentDJ');
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
            }

            bindEvents() {
                // Play/Pause
                this.playButton.addEventListener('click', () => this.togglePlay());
                
                // Volume
                this.volumeSlider.addEventListener('input', (e) => {
                    this.audio.volume = e.target.value / 100;
                });

                // Equalizer panel
                document.getElementById('equalizerBtn').addEventListener('click', () => {
                    this.equalizerPanel.classList.toggle('active');
                });

                // Animation controls
                document.querySelectorAll('.animation-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.animation-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.changeAnimation(e.target.dataset.animation);
                    });
                });

                // Audio events
                this.audio.addEventListener('play', () => this.onPlay());
                this.audio.addEventListener('pause', () => this.onPause());
                this.audio.addEventListener('error', () => this.onError());
                this.audio.addEventListener('loadstart', () => this.onLoadStart());
            }

            async togglePlay() {
                try {
                    if (this.isPlaying) {
                        this.audio.pause();
                    } else {
                        await this.audio.play();
                    }
                } catch (error) {
                    console.error('Error al reproducir:', error);
                    this.showStatus('Error de conexión', 'error');
                }
            }

            onPlay() {
                this.isPlaying = true;
                this.playButton.innerHTML = '⏸️';
                this.albumArt.classList.add('playing');
                this.showStatus('En línea', 'online');
            }

            onPause() {
                this.isPlaying = false;
                this.playButton.innerHTML = '▶️';
                this.albumArt.classList.remove('playing');
                this.showStatus('Pausado', 'paused');
            }

            onError() {
                this.showStatus('Error de conexión', 'error');
                this.statusDot.classList.add('disconnected');
            }

            onLoadStart() {
                this.showStatus('Conectando...', 'loading');
            }

            showStatus(message, type) {
                this.statusText.textContent = message;
                this.statusDot.classList.remove('disconnected');
                
                if (type === 'error') {
                    this.statusDot.classList.add('disconnected');
                }
            }

            changeAnimation(type) {
                this.currentAnimation = type;
                this.albumArt.className = 'album-art';
                
                switch(type) {
                    case 'pulse':
                        this.albumArt.style.animation = 'pulse 1s ease-in-out infinite, gradientMove 3s ease-in-out infinite';
                        break;
                    case 'wave':
                        this.albumArt.style.animation = 'wave 2s ease-in-out infinite, gradientMove 3s ease-in-out infinite';
                        break;
                    case 'disco':
                        this.albumArt.style.background = 'conic-gradient(from 0deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ff6b6b)';
                        this.albumArt.style.animation = 'rotate 2s linear infinite';
                        break;
                    default:
                        this.albumArt.style.animation = 'gradientMove 3s ease-in-out infinite';
                }
                
                if (this.isPlaying) {
                    this.albumArt.classList.add('playing');
                }
            }

            async startMetadataFetch() {
                // Simular metadatos (ya que SonicPanel requiere autenticación específica)
                const mockMetadata = [
                    { song: "🎵 Mix Aventura - Éxitos del momento", dj: "DJ Carlos Aventura" },
                    { song: "🎶 Radio Aventura Mix", dj: "En vivo desde los estudios" },
                    { song: "🎸 Música sin parar", dj: "Tu estación favorita" },
                    { song: "🎤 Los mejores éxitos", dj: "Radio Aventura MX" }
                ];

                let index = 0;
                setInterval(() => {
                    const current = mockMetadata[index % mockMetadata.length];
                    this.currentSong.textContent = current.song;
                    this.currentDJ.textContent = current.dj;
                    index++;
                }, 15000); // Cambiar cada 15 segundos

                // Configuración inicial
                this.currentSong.textContent = "🎵 Radio Aventura MX - Tu estación favorita";
                this.currentDJ.textContent = "Transmitiendo desde EstacionKusmediosDigital";
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            new RadioPlayer();
        });
    </script>
</body>
</html>
