<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Generador de Avatar • estacionkusfm</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">
  <!-- <link rel="stylesheet" href="https://kit.fontawesome.com/df2a1fbcf1.css" crossorigin="anonymous"> -->
  <style>
    body {
      background: linear-gradient(135deg, #f8e473 0%, #70e1f5 100%);
      font-family: 'Contrail One', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container-main {
      max-width: 500px;
      margin: 40px auto 0 auto;
      padding: 20px 10px 40px 10px;
      background: rgba(255,255,255,0.93);
      border-radius: 18px;
      box-shadow: 0 4px 32px #70e1f577;
    }
    .mini-player {
      background: #fffbe9;
      border: 2px solid #70e1f5;
      border-radius: 14px;
      box-shadow: 0 1px 8px #ffd60066;
      padding: 13px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    .mini-player-avatar {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      border: 2px solid #00dcff;
      background: #fff;
      object-fit: cover;
      box-shadow: 0 2px 10px #70e1f533;
    }
    .mini-player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }
    .mini-player-dj {
      font-family: 'Contrail One', Arial, sans-serif;
      font-size: 1.22rem;
      color: #ff9800;
      margin-bottom: 3px;
      word-break: break-all;
    }
    .mini-player-song {
      font-size: 1.01rem;
      color: #666;
      margin-bottom: 2px;
      min-height: 17px;
      font-family: Arial, sans-serif;
      word-break: break-all;
    }
    .mini-player-oyentes {
      font-size: 1rem;
      color: #00cfff;
    }
    .mini-player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 7px;
    }
    .mini-btn {
      background: #70e1f5;
      color: #ff9800;
      border: none;
      border-radius: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.18rem;
      box-shadow: 0 1px 5px #ffd60066;
      cursor: pointer;
      transition: background 0.2s;
      outline: none;
    }
    .mini-btn:active,
    .mini-btn:focus {
      background: #ffe082;
      color: #388e3c;
    }
    .mini-btn[disabled] {
      opacity: 0.55;
      pointer-events: none;
    }
    .avatar-generator-title {
      font-size: 1.4rem;
      color: #ff9800;
      text-align: center;
      margin-bottom: 13px;
      font-family: 'Contrail One', Arial, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0px 1px 6px #f8e473;
    }
    @media (max-width: 550px) {
      .container-main { max-width: 99vw; }
      .mini-player { padding: 13px 5px; }
      .mini-player-avatar { width: 46px; height: 46px; }
      .mini-btn { width: 28px; height: 28px; font-size: 1rem;}
      .mini-player { max-width: 99vw;}
    }
  </style>
</head>
<body>

  <div class="container-main">
    <!-- MINI PLAYER DJ -->
    <div class="mini-player" id="mini-player">
      <img id="mini-dj-head" class="mini-player-avatar"
        src="https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&headonly=1&size=m&direction=2&head_direction=2"
        alt="DJ Head">
      <div class="mini-player-info">
        <div class="mini-player-dj" id="mini-dj-name">estacionkusfm</div>
        <div class="mini-player-song" id="mini-dj-song"></div>
        <div class="mini-player-oyentes"><i class="fas fa-user-friends"></i> <span id="mini-dj-listeners">0</span> oyentes</div>
        <div class="mini-player-controls">
          <button class="mini-btn" id="mini-btn-reload" title="Recargar"><i class="fas fa-undo"></i></button>
          <button class="mini-btn" id="mini-btn-play" title="Reproducir"><i class="fas fa-play"></i></button>
          <button class="mini-btn" id="mini-btn-pause" title="Pausar"><i class="fas fa-pause"></i></button>
        </div>
        <audio id="mini-audio" preload="none">
          <source src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" type="audio/mpeg">
          Tu navegador no soporta audio HTML5.
        </audio>
      </div>
    </div>

    <!-- GENERADOR DE AVATAR -->
    <div>
      <div class="avatar-generator-title">Generador de Avatar Habbo</div>
      <iframe
        src="https://files.habboemotion.com/resources/generalscripts/generatorv2/"
        width="100%" height="470"
        style="border:none; border-radius:12px; min-height:340px; background:#fff"
        loading="lazy"
        title="Habbo Avatar Generator"></iframe>
    </div>
  </div>

  <!-- Scripts para el mini player -->
  <script src="https://kit.fontawesome.com/df2a1fbcf1.js" crossorigin="anonymous"></script>
  <script>
    // Actualiza info DJ y oyentes y tema
    function updateMiniPlayer() {
      fetch('https://radio.estacionkusmedios.com/api/nowplaying/esmerosound')
        .then(res => res.json())
        .then(data => {
          const live = data.live;
          const listeners = data.listeners && data.listeners.current ? data.listeners.current : 0;
          let dj = "estacionkusfm";
          if (live && live.is_live && live.streamer_name) {
            dj = live.streamer_name;
          }
          document.getElementById('mini-dj-name').textContent = dj;
          document.getElementById('mini-dj-listeners').textContent = listeners;
          document.getElementById('mini-dj-head').src =
            `https://www.habbo.es/habbo-imaging/avatarimage?user=${encodeURIComponent(dj)}&headonly=1&size=m&direction=2&head_direction=2`;
          // Mostrar tema/canción
          let song = "";
          if (data.now_playing && data.now_playing.song && data.now_playing.song.title) {
            song = data.now_playing.song.title;
          }
          document.getElementById('mini-dj-song').textContent = song;
        }).catch(() => {
          // En caso de error, mantener datos por defecto
        });
    }
    setInterval(updateMiniPlayer, 5000);
    updateMiniPlayer();

    // Mini player controles audio
    const audio = document.getElementById('mini-audio');
    const btnPlay = document.getElementById('mini-btn-play');
    const btnPause = document.getElementById('mini-btn-pause');
    const btnReload = document.getElementById('mini-btn-reload');

    btnPlay.onclick = function() {
      audio.play();
    };
    btnPause.onclick = function() {
      audio.pause();
    };
    btnReload.onclick = function() {
      audio.pause();
      audio.src = audio.src.split('?')[0] + '?t=' + new Date().getTime();
      audio.load();
      audio.play();
    };

    function updateBtnState() {
      if (audio.paused) {
        btnPlay.disabled = false;
        btnPause.disabled = true;
      } else {
        btnPlay.disabled = true;
        btnPause.disabled = false;
      }
    }
    audio.addEventListener('play', updateBtnState);
    audio.addEventListener('pause', updateBtnState);
    audio.addEventListener('ended', updateBtnState);
    updateBtnState();
  </script>
</body>
</html>
