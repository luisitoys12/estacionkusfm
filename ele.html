<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>La efectiva · Player con letras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a2840, #050816);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }

    #laefectiva-player {
      width: 100%;
      max-width: 430px;
      padding: 22px 20px 18px;
      background: radial-gradient(circle at top, #111827, #020617);
      border-radius: 26px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    /* Halo animado detrás del cover */
    #laefectiva-player::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255,122,41,0.35), transparent 70%);
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(8px);
      opacity: 0.9;
      pointer-events: none;
    }

    .lep-header {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .lep-logo {
      max-width: 210px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .lep-nowplaying {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .lep-cover-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(from 180deg,
        #ff7a29,
        #ff3069,
        #19d3ff,
        #ff7a29);
      animation: rotateGlow 16s linear infinite;
    }

    .lep-cover-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 18px rgba(0,0,0,0.7);
    }

    @keyframes rotateGlow {
      to { transform: rotate(360deg); }
    }

    .lep-track-info {
      flex: 1;
    }

    #lep-station-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    #lep-track-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    #lep-track-artist {
      font-size: 0.9rem;
      color: #e5e7eb;
    }

    #lep-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 2px 8px 2px 5px;
      font-size: 0.7rem;
      border-radius: 999px;
      background: #ef4444;
      box-shadow: 0 0 12px rgba(239,68,68,0.7);
    }

    #lep-live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #fee2e2;
      box-shadow: 0 0 6px #fee2e2;
    }

    .lep-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
      position: relative;
      z-index: 2;
    }

    .lep-controls button {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
    }

    .lep-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #lep-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffe9d5, #ff7a29);
      color: #111827;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
    }

    #lep-play.paused {
      background: radial-gradient(circle at 30% 20%, #dcfce7, #22c55e);
    }

    #lep-volume {
      flex: 1;
      accent-color: #ff7a29;
    }

    .lep-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #9ca3af;
      position: relative;
      z-index: 2;
    }

    .lep-bar {
      flex: 1;
      height: 4px;
      background: rgba(148,163,184,0.4);
      border-radius: 999px;
      overflow: hidden;
    }

    #lep-bar-inner {
      width: 25%;
      height: 100%;
      background: linear-gradient(90deg, #ff7a29, #ff3069);
    }

    /* Tabs inferiores */
    .lep-tabs {
      display: flex;
      margin-top: 14px;
      border-radius: 999px;
      background: rgba(15,23,42,0.85);
      padding: 3px;
      font-size: 0.75rem;
      position: relative;
      z-index: 2;
    }

    .lep-tab {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 999px;
      cursor: pointer;
      color: #9ca3af;
      user-select: none;
    }

    .lep-tab.active {
      background: linear-gradient(135deg, #ff7a29, #ff3069);
      color: #0b1120;
      font-weight: 600;
    }

    .lep-panels {
      margin-top: 10px;
      position: relative;
      z-index: 2;
      min-height: 150px;
    }

    .lep-panel {
      display: none;
      font-size: 0.8rem;
    }

    .lep-panel.active {
      display: block;
    }

    /* Panel info (historial resumido) */
    .lep-panel-info p {
      color: #e5e7eb;
      margin-bottom: 6px;
    }

    /* Panel historial (lista completa) */
    .lep-history {
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .lep-history h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    #lep-history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #lep-history-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(148,163,184,0.2);
      font-size: 0.8rem;
    }

    .lep-history-cover {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .lep-history-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .lep-history-meta {
      flex: 1;
    }

    .lep-history-time {
      color: #9ca3af;
      font-size: 0.7rem;
    }

    /* Panel lyrics */
    .lep-lyrics {
      max-height: 190px;
      overflow-y: auto;
      padding-right: 4px;
      line-height: 1.45;
    }

    .lep-lyrics-line {
      color: #d1d5db;
      margin-bottom: 4px;
      transition: color 0.2s, transform 0.2s;
    }

    .lep-lyrics-line.active {
      color: #f9fafb;
      transform: translateX(4px);
    }

    .lep-lyrics-empty {
      color: #9ca3af;
      font-style: italic;
    }

    /* Scrollbar sutil */
    .lep-history::-webkit-scrollbar,
    .lep-lyrics::-webkit-scrollbar {
      width: 4px;
    }
    .lep-history::-webkit-scrollbar-thumb,
    .lep-lyrics::-webkit-scrollbar-thumb {
      background: rgba(148,163,184,0.7);
      border-radius: 999px;
    }
  </style>
</head>
<body>

<div id="laefectiva-player">
  <div class="lep-header">
    <img src="https://i.imgur.com/f1OOFhr.jpeg"
         alt="La efectiva La Voz 14 Online"
         class="lep-logo">
  </div>

  <div class="lep-nowplaying">
    <div class="lep-cover-wrap">
      <img id="lep-cover"
           src="https://213.199.52.0/api/station/la_efectividad_la_voz_14_online_/art/e9f895412bc8d44987b9c1dd-1759266818.jpg"
           alt="Cover actual">
    </div>
    <div class="lep-track-info">
      <div id="lep-station-name">La efectiva · La Voz 14 Online</div>
      <div id="lep-track-title">Conectando…</div>
      <div id="lep-track-artist"></div>
      <div id="lep-live-badge">En vivo</div>
    </div>
  </div>

  <div class="lep-controls">
    <button id="lep-mute" aria-label="Silencio">🔈</button>
    <button id="lep-prev" disabled>⏮</button>
    <button id="lep-play" aria-label="Play/Pause">▶</button>
    <button id="lep-next" disabled>⏭</button>
    <input id="lep-volume" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div class="lep-progress">
    <span id="lep-current-time">LIVE</span>
    <div class="lep-bar">
      <div id="lep-bar-inner"></div>
    </div>
    <span id="lep-total-time">ON AIR</span>
  </div>

  <!-- Tabs -->
  <div class="lep-tabs">
    <div class="lep-tab active" data-target="info">Info</div>
    <div class="lep-tab" data-target="history">Historial</div>
    <div class="lep-tab" data-target="lyrics">Lyrics</div>
  </div>

  <!-- Paneles -->
  <div class="lep-panels">
    <div class="lep-panel lep-panel-info active" id="panel-info">
      <p id="lep-info-text">
        Disfruta la mejor música en La efectiva, la voz 14 online.
      </p>
    </div>

    <div class="lep-panel" id="panel-history">
      <div class="lep-history">
        <h3>Historial de canciones</h3>
        <ul id="lep-history-list"></ul>
      </div>
    </div>

    <div class="lep-panel" id="panel-lyrics">
      <div class="lep-lyrics" id="lep-lyrics-box">
        <p class="lep-lyrics-empty">
          Las letras aparecerán aquí si están disponibles para esta canción.
        </p>
      </div>
    </div>
  </div>

  <audio id="lep-audio" preload="none"
         src="https://lavoz14.vitrinamusical.com/listen/la_efectividad_la_voz_14_online_/radio.mp3">
  </audio>
</div>

<script>
  const STREAM_URL =
    "https://lavoz14.vitrinamusical.com/listen/la_efectividad_la_voz_14_online_/radio.mp3";

  const API_NOWPLAYING =
    "https://lavoz14.vitrinamusical.com/api/nowplaying/la_efectividad_la_voz_14_online_";

  const DEFAULT_COVER =
    "https://213.199.52.0/api/station/la_efectividad_la_voz_14_online_/art/e9f895412bc8d44987b9c1dd-1759266818.jpg";

  const audioEl   = document.getElementById("lep-audio");
  const playBtn   = document.getElementById("lep-play");
  const muteBtn   = document.getElementById("lep-mute");
  const volumeInp = document.getElementById("lep-volume");
  const barInner  = document.getElementById("lep-bar-inner");

  const titleEl   = document.getElementById("lep-track-title");
  const artistEl  = document.getElementById("lep-track-artist");
  const coverEl   = document.getElementById("lep-cover");
  const historyUl = document.getElementById("lep-history-list");
  const lyricsBox = document.getElementById("lep-lyrics-box");

  audioEl.src = STREAM_URL;

  // Play / pause
  playBtn.addEventListener("click", () => {
    if (audioEl.paused) {
      audioEl.play()
        .then(() => {
          playBtn.textContent = "⏸";
          playBtn.classList.add("paused");
        })
        .catch(err => console.error(err));
    } else {
      audioEl.pause();
      playBtn.textContent = "▶";
      playBtn.classList.remove("paused");
    }
  });

  // Volumen
  volumeInp.addEventListener("input", () => {
    audioEl.volume = volumeInp.value;
    localStorage.setItem("lep-volume", volumeInp.value);
  });

  // Mute
  muteBtn.addEventListener("click", () => {
    audioEl.muted = !audioEl.muted;
    muteBtn.textContent = audioEl.muted ? "🔇" : "🔈";
  });

  // Restaurar volumen
  const savedVol = localStorage.getItem("lep-volume");
  if (savedVol !== null) {
    volumeInp.value = savedVol;
    audioEl.volume = savedVol;
  }

  // Progreso decorativo
  let fakeProgress = 0;
  setInterval(() => {
    fakeProgress += 3;
    if (fakeProgress > 100) fakeProgress = 0;
    barInner.style.width = fakeProgress + "%";
  }, 1000);

  // Tabs
  document.querySelectorAll(".lep-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document
        .querySelectorAll(".lep-tab")
        .forEach(t => t.classList.remove("active"));
      document
        .querySelectorAll(".lep-panel")
        .forEach(p => p.classList.remove("active"));

      tab.classList.add("active");
      const target = tab.getAttribute("data-target");
      document.getElementById("panel-" + target).classList.add("active");
    });
  });

  // Lyrics: estructura interna para posible sync
  let currentLyrics = []; // {time: segundos o null, text: string}
  let lyricsSyncInterval = null;

  function clearLyrics() {
    currentLyrics = [];
    if (lyricsSyncInterval) {
      clearInterval(lyricsSyncInterval);
      lyricsSyncInterval = null;
    }
    lyricsBox.innerHTML =
      '<p class="lep-lyrics-empty">Las letras aparecerán aquí si están disponibles para esta canción.</p>';
  }

  function renderLyrics(lines) {
    // lines: array de objetos {time: segundos|null, text: string}
    currentLyrics = lines;
    lyricsBox.innerHTML = "";

    lines.forEach((line, index) => {
      const p = document.createElement("p");
      p.className = "lep-lyrics-line";
      p.dataset.index = index.toString();
      p.textContent = line.text;
      lyricsBox.appendChild(p);
    });

    if (lines.some(l => typeof l.time === "number")) {
      // Lyrics con timestamps
      lyricsSyncInterval = setInterval(() => {
        const t = audioEl.currentTime;
        let activeIndex = -1;
        for (let i = 0; i < currentLyrics.length; i++) {
          const l = currentLyrics[i];
          const next = currentLyrics[i + 1];
          if (typeof l.time === "number") {
            const start = l.time;
            const end = typeof next?.time === "number" ? next.time : t + 10;
            if (t >= start && t < end) {
              activeIndex = i;
              break;
            }
          }
        }
        document
          .querySelectorAll(".lep-lyrics-line")
          .forEach(el => el.classList.remove("active"));
        if (activeIndex >= 0) {
          const activeEl = document.querySelector(
            '.lep-lyrics-line[data-index="' + activeIndex + '"]'
          );
          if (activeEl) {
            activeEl.classList.add("active");
            const parent = lyricsBox;
            const offsetTop = activeEl.offsetTop;
            parent.scrollTo({
              top: offsetTop - parent.clientHeight / 2 + 20,
              behavior: "smooth"
            });
          }
        }
      }, 500);
    }
  }

  // Demo de fetchLyrics:
  // Por ahora hace una petición GET a una URL ficticia; tú solo cambias baseURL
  async function fetchLyrics(artist, title) {
    clearLyrics();

    if (!artist && !title) return;

    // Ajusta esta URL a tu backend o API de letras
    const baseURL = "https://example.com/lyrics-api"; // REEMPLAZAR
    const url =
      baseURL +
      "?artist=" +
      encodeURIComponent(artist) +
      "&title=" +
      encodeURIComponent(title);

    try {
      // Si aún no tienes backend, comentas todo este bloque y pones unas lyrics de demo.
      const res = await fetch(url);
      if (!res.ok) {
        console.warn("No hay lyrics para:", artist, title);
        return;
      }
      const data = await res.json();
      // Se espera un JSON tipo:
      // { lines: [ { time: 12.3, text: "línea 1" }, { time: null, text: "línea 2" } ] }
      if (Array.isArray(data.lines) && data.lines.length) {
        renderLyrics(data.lines);
      }
    } catch (err) {
      console.error("Error al cargar lyrics", err);
    }
  }

  // Para mostrar algo al cliente, dejamos un fallback de letras de demo
  function renderDemoLyrics(artist, title) {
    clearLyrics();
    const demo = [
      { time: null, text: "♫ " + (artist || "Artista") + " - " + (title || "Canción") + " ♫" },
      { time: null, text: "" },
      { time: null, text: "Letra de ejemplo para mostrar" },
      { time: null, text: "cómo se verían las líneas de la canción" },
      { time: null, text: "dentro del player de La efectiva." },
      { time: null, text: "" },
      { time: null, text: "Cuando se conecte a una API real," },
      { time: null, text: "aquí aparecerán las letras verdaderas." }
    ];
    renderLyrics(demo);
  }

  // Now playing + historial + lyrics
  async function fetchNowPlaying() {
    try {
      const res = await fetch(API_NOWPLAYING);
      if (!res.ok) return;
      const data = await res.json();

      const now = data.now_playing || data.nowPlaying || data;
      const song = now.song || {};
      const npTitle  = song.title || now.song?.text || "En reproducción";
      const npArtist = song.artist || "";

      titleEl.textContent  = npTitle;
      artistEl.textContent = npArtist;

      const art =
        song.art ||
        now.art ||
        (data.station && data.station.art) ||
        DEFAULT_COVER;
      coverEl.src = art;

      const history = data.song_history || data.songHistory || [];
      historyUl.innerHTML = "";
      history.forEach(item => {
        const hSong = item.song || {};
        const li = document.createElement("li");

        const coverWrap = document.createElement("div");
        coverWrap.className = "lep-history-cover";
        const img = document.createElement("img");
        img.src = hSong.art || art || DEFAULT_COVER;
        coverWrap.appendChild(img);

        const meta = document.createElement("div");
        meta.className = "lep-history-meta";
        meta.textContent =
          (hSong.artist || "").trim() +
          (hSong.artist && hSong.title ? " - " : "") +
          (hSong.title || "");

        const time = document.createElement("div");
        time.className = "lep-history-time";
        const played = item.played_at ? new Date(item.played_at * 1000) : null;
        time.textContent = played
          ? played.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})
          : "";

        li.appendChild(coverWrap);
        li.appendChild(meta);
        li.appendChild(time);
        historyUl.appendChild(li);
      });

      // Lyrics: primero intenta API (comentada) y dejamos demo para cliente
      // await fetchLyrics(npArtist, npTitle);
      renderDemoLyrics(npArtist, npTitle);

    } catch (e) {
      console.error(e);
    }
  }

  fetchNowPlaying();
  setInterval(fetchNowPlaying, 15000);
</script>

</body>
</html>
