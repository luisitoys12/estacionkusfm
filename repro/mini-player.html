<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KUSFM MiniPlayer Verano</title>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet"/>
  <style>
    body {
      background: #e5fff9;
      margin: 0;
      padding: 0;
      font-family: 'Contrail One', Arial, sans-serif;
    }
    .kusfm-miniplayer {
      display: flex;
      align-items: center;
      border-radius: 1.2em;
      box-shadow: 0 3px 16px #0002;
      padding: 1em 1.2em;
      width: 100%;
      max-width: 530px;
      margin: 40px auto;
      position: relative;
      min-height: 120px;
      border: 2.5px solid #00dcff;
      background: url('https://images.habbo.com/c_images/article_images_hq/article_summer2011_newclothes.gif') center/cover no-repeat;
      overflow: visible;
    }
    /* Cuadro piedra detrás del avatar */
    .mini-avatar-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 0.8em;
    }
    .mini-avatar-bg {
      position: absolute;
      width: 64px;
      height: 64px;
      left: 0; top: 0;
      background: url('https://img.freepik.com/free-photo/rock-texture-background_1194-5519.jpg?w=300&q=70') center/cover no-repeat;
      border-radius: 12px;
      filter: brightness(0.92) contrast(1.12) grayscale(0.11);
      box-shadow: 0 3px 14px #0004, 0 0 0 4px #2224;
      z-index: 1;
    }
    /* Efecto disco animado solo delante del cuadro piedra */
    .mini-avatar-disco {
      position: absolute;
      width: 64px;
      height: 64px;
      left: 0; top: 0;
      border-radius: 12px;
      z-index: 2;
      pointer-events: none;
      /* Fondo disco animado */
      background: conic-gradient(
        #ffdf2a 10%, #ff72b5 30%, #00dcff 60%, #30d191 80%, #ffdf2a 100%
      );
      mix-blend-mode: lighten;
      opacity: 0.45;
      animation: disco-colors 2s linear infinite;
    }
    @keyframes disco-colors {
      0% { filter: hue-rotate(0deg) brightness(1.04);}
      100% { filter: hue-rotate(360deg) brightness(1.08);}
    }
    /* Avatar cuadrado encima del efecto disco */
    .mini-avatar {
      width: 50px; height: 50px;
      border-radius: 7px;
      background: #eee;
      object-fit: cover;
      box-shadow: 0 2px 6px #30d19199, 0 0px 0px #0001;
      border: 3.5px solid #fff;
      position: relative;
      z-index: 3;
      transition: transform 0.16s;
      background-color: #fff;
    }
    .mini-avatar:hover { transform: scale(1.10) rotate(-6deg);}
    /* Resto del miniplayer igual */
    .mini-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }
    .mini-alliance {
      background: #fffae3;
      color: #ffdf2a;
      border-radius: 1em;
      font-size: 1.13em;
      padding: 4px 18px 4px 13px;
      margin-bottom: 7px;
      font-weight: 700;
      box-shadow: 0 2px 8px #ffe15a39;
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      letter-spacing: .03em;
      border: 1.5px solid #ffdf2a;
    }
    .mini-box {
      background: rgba(0,0,0,0.30);
      color: #fff;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 1.08em;
      font-weight: bold;
      text-shadow: 0 2px 4px #000c, 0 2px 10px #000a;
      display: flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 2px;
      min-height: 32px;
    }
    .mini-title-artist {
      font-size: 1.13em;
      padding: 7px 12px;
      margin-bottom: 4px;
      justify-content: flex-start;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .mini-dj-box {
      justify-content: flex-start;
    }
    .mini-listeners-box {
      justify-content: flex-start;
    }
    .mini-controls-row {
      display: flex;
      align-items: center;
      gap: 0.65em;
      margin-top: 2px;
    }
    .mini-controls {
      display: flex;
      gap: 0.5em;
    }
    .mini-controls button {
      background: #00dcff;
      color: #23203a;
      border: none;
      border-radius: 50%;
      width: 34px; height: 34px;
      font-size: 1.2em;
      cursor: pointer;
      border: 2px solid #ffdf2a;
      transition: background .18s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-controls button:active, .mini-controls button:focus {
      background: #ffdf2a;
      color: #00dcff;
    }
    .mini-volume-group {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .mini-volume {
      background: rgba(0,0,0,0.30);
      border-radius: 8px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 0.2em;
      color: #fff;
      font-size: 1.05em;
      min-height: 32px;
    }
    .mini-volume input[type="range"] {
      width: 58px;
      accent-color: #30d191;
      margin-left: 2px;
    }
    .mini-music-info-btn {
      background: #fff;
      color: #23203a;
      border: none;
      border-radius: 50%;
      font-size: 1.5em;
      width: 36px; height: 36px;
      box-shadow: 0 3px 12px #0003;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s;
      margin-left: 4px;
    }
    .mini-music-info-btn:hover {
      background: #ffdf2a;
      color: #00dcff;
    }
    /* Modal */
    .modal-bg {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.65);
      align-items: center;
      justify-content: center;
    }
    .modal-bg.active { display: flex; }
    .modal-content {
      background: #111d;
      color: #fff;
      border-radius: 1em;
      padding: 24px 20px 16px 20px;
      max-width: 350px;
      width: 95vw;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 32px #000a;
      font-family: 'Contrail One', Arial, sans-serif;
      animation: modalIn .2s;
    }
    @keyframes modalIn { from { transform:scale(0.85); opacity:0; } to { transform:scale(1); opacity:1; } }
    .modal-close {
      position: absolute; right: 10px; top: 10px; font-size: 1.5em;
      background: none; color: #fff; border: none; cursor: pointer;
    }
    .modal-album {
      margin: 8px auto 8px auto;
      border-radius: 12px;
      width: 120px; height: 120px;
      object-fit: cover;
      box-shadow:0 3px 18px #000a;
    }
    .modal-label {
      font-size:1.02em; margin-top: 10px; color: #ffdf2a;
    }
    .modal-history-list {
      text-align: left;
      margin: 10px 0 0 0;
      padding: 0;
      list-style: none;
    }
    .modal-history-list li {
      margin: 4px 0;
      font-size: 0.98em;
      border-bottom: 1px solid #fff2;
      padding-bottom: 2px;
    }
    /* Adornos de verano */
    .verano-sun {
      position: absolute; left: -33px; top: -28px; width: 56px; height:56px;
      z-index: 2; pointer-events: none; animation: verano-sun-spin 11s linear infinite;
    }
    @keyframes verano-sun-spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
    .verano-palm {
      position: absolute; left: -27px; bottom: -14px; width: 54px; height:54px;
      z-index: 2; pointer-events: none; filter: drop-shadow(0 3px 7px #30d19180);
      animation: verano-palm-swing 2.5s ease-in-out infinite alternate;
    }
    @keyframes verano-palm-swing { 0%{transform:rotate(-6deg);} 100%{transform:rotate(6deg);} }
    .verano-flower {
      position: absolute; right: -22px; top: -20px; width: 37px; height:37px;
      z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 7px #ffb5e2);
      animation: verano-flower-bounce 2.2s ease-in-out infinite alternate;
    }
    @keyframes verano-flower-bounce { 0%{transform:translateY(0);} 100%{transform:translateY(9px);} }
    @media (max-width:600px) {
      .kusfm-miniplayer { max-width: 100%; font-size: 0.95em;}
      .mini-avatar-wrapper { width: 44px; height: 44px;}
      .mini-avatar-bg, .mini-avatar-disco { width: 44px; height: 44px;}
      .mini-avatar { width: 34px; height: 34px;}
      .verano-sun { left:-14px; top:-9px; width:33px; height:33px;}
      .verano-palm { left:-12px; bottom:-5px; width:28px; height:28px;}
      .verano-flower { right:-8px; top:-7px; width:19px; height:19px;}
      .modal-content { max-width: 95vw; }
    }
  </style>
</head>
<body>
  <div class="kusfm-miniplayer">
    <img class="verano-sun" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="Sol verano" />
    <img class="verano-palm" src="https://cdn-icons-png.flaticon.com/512/619/619034.png" alt="Palmera verano" />
    <img class="verano-flower" src="https://cdn-icons-png.flaticon.com/512/3038/3038938.png" alt="Flor verano" />

    <div class="mini-avatar-wrapper">
      <div class="mini-avatar-bg"></div>
      <div class="mini-avatar-disco"></div>
      <img
        id="mini-dj-avatar"
        class="mini-avatar"
        src="https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&gesture=wav&action=std&direction=2&head_direction=2&headonly=0"
        alt="DJ Avatar"
      />
    </div>
    <div class="mini-info">
      <div class="mini-alliance">
        🤝 Alianza con KUSFM
      </div>
      <div class="mini-box mini-title-artist">
        <span id="mini-song-marquee">Cargando canción...</span>
      </div>
      <div class="mini-box mini-dj-box" id="mini-dj-box">
        🎙️ <span id="mini-dj-name">DJ: ...</span>
      </div>
      <div class="mini-box mini-listeners-box" id="mini-listeners-box">
        👥 <span id="mini-listeners">0</span> oyentes
      </div>
      <div class="mini-controls-row">
        <div class="mini-controls">
          <button id="mini-play" title="Reproducir">&#9654;</button>
          <button id="mini-pause" title="Pausar">&#10073;&#10073;</button>
          <button id="mini-mute" title="Mute">&#128263;</button>
          <button id="mini-reload" title="Recargar">&#x21bb;</button>
        </div>
        <div class="mini-volume-group">
          <div class="mini-volume" title="Volumen">
            <span>&#128266;</span>
            <input id="mini-volume-slider" type="range" min="0" max="100" value="80" />
          </div>
          <button class="mini-music-info-btn" id="mini-music-info-btn" title="Info musical">&#127925;</button>
        </div>
      </div>
      <audio id="mini-audio" src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" preload="none"></audio>
    </div>
  </div>

  <!-- Modal musical -->
  <div class="modal-bg" id="mini-music-modal">
    <div class="modal-content">
      <button class="modal-close" id="mini-music-close" title="Cerrar">&times;</button>
      <img src="" class="modal-album" id="modal-album-art" alt="Portada álbum" style="display:none;">
      <div class="modal-label">Tema actual</div>
      <div id="modal-current-song" style="font-size:1.08em; margin:6px 0 10px 0;"></div>
      <div class="modal-label">Últimos 4 temas</div>
      <ul class="modal-history-list" id="modal-song-history"></ul>
    </div>
  </div>

  <script>
    // --- Configuración ---
    const MINI_API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';

    // --- Utilidades ---
    function getMiniHabboAvatar(username) {
      return `https://www.habbo.es/habbo-imaging/avatarimage?user=${encodeURIComponent(username)}&gesture=wav&action=std&direction=2&head_direction=2&headonly=0`;
    }

    // --- Actualiza el player y modal ---
    function updateMiniPlayer() {
      fetch(MINI_API_NOWPLAYING_URL)
        .then(r => r.json())
        .then(data => {
          const song = data.now_playing.song;
          const live = data.live;
          const listeners = data.listeners.current;
          const artist = song.artist || "Desconocido";
          const title = song.title || "Desconocido";
          document.getElementById('mini-song-marquee').textContent = `${artist} - ${title}`;

          // DJ info
          let nombreDj;
          if (live && live.is_live && live.streamer_name) {
            nombreDj = live.streamer_name;
            document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar(nombreDj);
          } else {
            nombreDj = "AutoDJ";
            document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar("estacionkusfm");
          }
          document.getElementById('mini-dj-name').textContent = "DJ: " + nombreDj;

          // Oyentes
          document.getElementById('mini-listeners').textContent = listeners !== undefined ? listeners : "0";

          // Para el modal
          window.miniMusicModalData = {
            albumArt: song.art || "",
            current: `${artist} - ${title}`,
            history: (data.song_history || []).slice(0, 4).map(s => `${s.song.artist} - ${s.song.title}`)
          };
        })
        .catch(() => {
          document.getElementById('mini-song-marquee').textContent = "";
          document.getElementById('mini-dj-name').textContent = "DJ: ...";
          document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar("estacionkusfm");
          document.getElementById('mini-listeners').textContent = "0";
          window.miniMusicModalData = { albumArt: "", current: "", history: [] };
        });
    }

    // --- Controles player ---
    function setupPlayerControls() {
      const audio = document.getElementById('mini-audio');
      document.getElementById('mini-play').onclick = () => audio.play();
      document.getElementById('mini-pause').onclick = () => audio.pause();
      document.getElementById('mini-mute').onclick = () => audio.muted = !audio.muted;
      document.getElementById('mini-reload').onclick = () => {
        audio.pause();
        audio.src = audio.src.split('?')[0] + '?t=' + Date.now();
        audio.load();
        audio.play();
      };
      const volume = document.getElementById('mini-volume-slider');
      audio.volume = volume.value / 100;
      volume.addEventListener('input', () => { audio.volume = volume.value / 100; });
    }

    // --- Modal musical ---
    function setupMusicModal() {
      const modal = document.getElementById('mini-music-modal');
      const modalBtn = document.getElementById('mini-music-info-btn');
      const modalClose = document.getElementById('mini-music-close');
      const modalAlbum = document.getElementById('modal-album-art');
      const modalCurrent = document.getElementById('modal-current-song');
      const modalHistory = document.getElementById('modal-song-history');

      function openMusicModal() {
        let d = window.miniMusicModalData || {};
        if (d.albumArt) {
          modalAlbum.src = d.albumArt;
          modalAlbum.style.display = '';
        } else {
          modalAlbum.style.display = 'none';
        }
        modalCurrent.textContent = d.current || '';
        modalHistory.innerHTML = "";
        (d.history || []).forEach(t => {
          let li = document.createElement("li");
          li.textContent = t;
          modalHistory.appendChild(li);
        });
        modal.classList.add('active');
      }

      modalBtn.onclick = openMusicModal;
      modalClose.onclick = () => modal.classList.remove('active');
      modal.onclick = e => { if (e.target === modal) modal.classList.remove('active'); };
      window.addEventListener('keydown', e => { if (e.key === "Escape") modal.classList.remove('active'); });
    }

    // --- Inicialización ---
    window.addEventListener("load", () => {
      updateMiniPlayer();
      setupPlayerControls();
      setupMusicModal();
      setInterval(updateMiniPlayer, 5000);
    });
  </script>
</body>
</html>
