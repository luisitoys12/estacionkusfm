<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KUSFM MiniPlayer Verano</title>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e5fff9;
      margin: 0;
      padding: 0;
    }
    .kusfm-miniplayer {
      display: flex;
      align-items: center;
      border-radius: 1.2em;
      box-shadow: 0 3px 16px #0002;
      padding: 1em 1.2em;
      width: 100%;
      max-width: 530px;
      font-family: 'Contrail One', Arial, sans-serif;
      position: relative;
      min-height: 110px;
      border: 2.5px solid #00dcff;
      margin: 40px auto;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
      overflow: visible;
    }
    .mini-avatar {
      width: 56px; height: 56px; border-radius: 50%; background: #eee; object-fit: cover;
      box-shadow: 0 3px 12px #00dcff60;
      flex-shrink: 0;
      border: 3.5px solid #30d191;
    }
    .mini-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.5em;}
    .mini-title-artist {
      font-size: 1.1em;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 2px 4px #000c, 0 2px 10px #000a;
      background: rgba(0,0,0,0.30);
      padding: 4px 10px;
      border-radius: 8px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .mini-dj {
      font-size: 1em;
      color: #fff;
      text-shadow: 0 2px 4px #000c;
    }
    .mini-listeners {
      font-size:1em;
      color:#fff;
      text-shadow: 0 2px 4px #000c;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .mini-controls { display:flex; gap:0.5em; margin-top:0.5em;}
    .mini-controls button {
      background: #00dcff; color: #23203a; border: none; border-radius: 50%;
      width: 34px; height: 34px; font-size: 1.2em;
      cursor: pointer;
      border: 2px solid #ffdf2a;
      transition: background .18s;
    }
    .mini-controls button:active, .mini-controls button:focus { background: #ffdf2a; color:#00dcff;}
    .mini-volume { margin-left: 0.5em; display: flex; align-items: center; gap: 0.2em;}
    .mini-volume input[type="range"] { width: 58px; accent-color: #30d191;}
    .mini-socials {
      margin-top: 0.3em;
      display: flex;
      gap: 8px;
    }
    .mini-socials img {
      width: 24px; height: 24px; border-radius: 4px; background: #fff8; padding: 2px;
      box-shadow:0 1.5px 7px #ffdf2a40;
      transition: transform 0.15s;
    }
    .mini-socials img:hover {
      transform: scale(1.15);
      background: #fff;
    }
    /* Adornos */
    .verano-sun {
      position: absolute; left: -33px; top: -28px; width: 56px; height:56px;
      z-index: 2; pointer-events: none; animation: verano-sun-spin 11s linear infinite;
    }
    @keyframes verano-sun-spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
    .verano-palm {
      position: absolute; left: -27px; bottom: -14px; width: 54px; height:54px;
      z-index: 2; pointer-events: none; filter: drop-shadow(0 3px 7px #30d19180);
      animation: verano-palm-swing 2.5s ease-in-out infinite alternate;
    }
    @keyframes verano-palm-swing { 0%{transform:rotate(-6deg);} 100%{transform:rotate(6deg);} }
    .verano-flower {
      position: absolute; right: -22px; top: -20px; width: 37px; height:37px;
      z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 7px #ffb5e2);
      animation: verano-flower-bounce 2.2s ease-in-out infinite alternate;
    }
    @keyframes verano-flower-bounce { 0%{transform:translateY(0);} 100%{transform:translateY(9px);} }
    @media (max-width:600px) {
      .kusfm-miniplayer { max-width: 100%; font-size: 0.95em;}
      .mini-avatar { width: 40px; height: 40px; }
      .verano-sun { left:-14px; top:-9px; width:33px; height:33px;}
      .verano-palm { left:-12px; bottom:-5px; width:28px; height:28px;}
      .verano-flower { right:-8px; top:-7px; width:19px; height:19px;}
    }
  </style>
</head>
<body>
  <div class="kusfm-miniplayer">
    <!-- Adornos de verano -->
    <img class="verano-sun" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="Sol verano">
    <img class="verano-palm" src="https://cdn-icons-png.flaticon.com/512/619/619034.png" alt="Palmera verano">
    <img class="verano-flower" src="https://cdn-icons-png.flaticon.com/512/3038/3038938.png" alt="Flor verano">
    <img id="mini-dj-avatar" class="mini-avatar" src="https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&gesture=wav&action=std&direction=2&head_direction=2&headonly=0" alt="DJ Avatar">
    <div class="mini-info">
      <div class="mini-title-artist">
        <span id="mini-song-marquee">Cargando canción...</span>
      </div>
      <div class="mini-dj" id="mini-dj-name">DJ: ...</div>
      <div class="mini-listeners">👥 <span id="mini-listeners">0</span> oyentes</div>
      <div class="mini-controls">
        <button id="mini-play" title="Reproducir">&#9654;</button>
        <button id="mini-pause" title="Pausar">&#10073;&#10073;</button>
        <button id="mini-mute" title="Mute">&#128263;</button>
        <button id="mini-reload" title="Recargar">&#x21bb;</button>
        <div class="mini-volume" title="Volumen">
          <span>&#128266;</span>
          <input id="mini-volume-slider" type="range" min="0" max="100" value="80">
        </div>
      </div>
      <div class="mini-socials">
        <a href="https://facebook.com/estacionkusfm" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook"></a>
        <a href="https://twitter.com/estacionkusfm" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitter.svg" alt="Twitter"></a>
        <a href="https://instagram.com/estacionkusfm" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram"></a>
      </div>
      <audio id="mini-audio" src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" preload="none"></audio>
    </div>
  </div>
  <script>
    const MINI_API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';
    function getMiniHabboAvatar(username) {
      return "https://www.habbo.es/habbo-imaging/avatarimage"
        + "?user=" + encodeURIComponent(username)
        + "&gesture=wav&action=std&direction=2&head_direction=2&headonly=0";
    }
    function updateMiniPlayer() {
      fetch(MINI_API_NOWPLAYING_URL)
        .then(r=>r.json())
        .then(data=>{
          const song = data.now_playing.song;
          const live = data.live;
          const listeners = data.listeners.current;
          let artist = song.artist ? song.artist : "Desconocido";
          let title = song.title ? song.title : "Desconocido";
          document.getElementById('mini-song-marquee').textContent = artist + " - " + title;
          let nombreDj;
          if(live && live.is_live && live.streamer_name){
            nombreDj = live.streamer_name;
            document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar(nombreDj);
          } else {
            nombreDj = "AutoDJ";
            document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar("estacionkusfm");
          }
          document.getElementById('mini-dj-name').textContent = "DJ: " + nombreDj;
          document.getElementById('mini-listeners').textContent = listeners !== undefined ? listeners : "0";
        })
        .catch(()=>{
          document.getElementById('mini-song-marquee').textContent = "";
          document.getElementById('mini-dj-name').textContent = "DJ: ...";
          document.getElementById('mini-dj-avatar').src = getMiniHabboAvatar("estacionkusfm");
          document.getElementById('mini-listeners').textContent = "0";
        });
    }
    window.addEventListener("load", updateMiniPlayer);
    setInterval(updateMiniPlayer,5000);

    // Controles básicos
    const miniAudio = document.getElementById('mini-audio');
    document.getElementById('mini-play').onclick = ()=>miniAudio.play();
    document.getElementById('mini-pause').onclick = ()=>miniAudio.pause();
    document.getElementById('mini-mute').onclick = ()=>{
      miniAudio.muted = !miniAudio.muted;
    };
    document.getElementById('mini-reload').onclick = ()=>{
      miniAudio.pause();
      miniAudio.src = miniAudio.src.split('?')[0] + '?t=' + new Date().getTime();
      miniAudio.load();
      miniAudio.play();
    };
    const miniVolume = document.getElementById('mini-volume-slider');
    miniAudio.volume = miniVolume.value/100;
    miniVolume.addEventListener('input', e => { miniAudio.volume = miniVolume.value/100; });
  </script>
</body>
</html>
