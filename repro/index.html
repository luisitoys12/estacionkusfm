<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KUSFM Player Compacto Verano</title>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet"/>
  <style>
    body {
      background: #e5fff9;
      margin: 0;
      padding: 0;
      font-family: 'Contrail One', Arial, sans-serif;
    }
    .kusfm-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 0.5em;
      box-shadow: none;
      padding: 0.5em;
      width: auto;
      max-width: 410px;
      min-width: 210px;
      margin: 0 auto;
      position: relative;
      min-height: unset;
      border: 2px solid #00dcff;
      background: #fff;
      overflow: visible;
    }
    /* Elimina adornos de verano */
    .verano-sun, .verano-palm { display: none !important; }
    /* Avatar */
    .player-avatar-wrap {
      position: relative;
      width: 70px;
      min-width: 70px;
      height: 90px;
      border-radius: 10px;
      overflow: visible;
      background: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 0.1em;
      margin-right: 10px;
    }
    .player-avatar-bg,
    .player-avatar-disco { display: none; }
    .player-avatar-img {
      width: 65px; height: 86px;
      object-fit: contain;
      object-position: bottom center;
      border-radius: 8px;
      background: #fff;
      border: 2px solid #fff;
      box-shadow: 0 1.5px 4px #30d19166;
      position: relative;
      z-index: 3;
      display: block;
      margin-left: 2px;
      margin-top: 2px;
    }
    /* Info principal de canción */
    .player-maininfo {
      flex:1;
      min-width:0;
      display: flex;
      flex-direction: column;
      gap: 0.1em;
      margin-top: 0.1em;
    }
    .main-title-artist {
      font-size: 1em;
      color: #23203a;
      font-weight: bold;
      background: #f3f8fa;
      border-radius: 7px;
      padding: 5px 10px 5px 9px;
      margin-bottom: 0.1em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.2em;
      min-height: 1.5em;
      box-shadow: none;
      text-shadow: none;
    }
    .main-dj {
      color: #ff72b5;
      font-size: 0.97em;
      font-weight: 600;
      background: #fff0;
      border-radius: 6px;
      padding: 2px 9px;
      margin-bottom: 0.05em;
      margin-top:1px;
      text-shadow: none;
    }
    .main-listeners {
      color: #00dcff;
      background: #fff0;
      font-size: 0.97em;
      border-radius: 5px;
      padding: 2px 8px;
      margin-bottom: 0.01em;
      font-weight: 600;
    }
    /* Flex fila */
    .player-rowflex {
      display: flex;
      align-items: flex-start;
      width: 100%;
      gap: 0.2em;
      margin-bottom: 0.08em;
      margin-top: 0.08em;
    }
    /* Controles */
    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 0.28em;
      margin: 0.3em 0 0.08em 0;
      width: 100%;
      justify-content: center;
    }
    .player-controls {
      display: flex;
      gap: 0.11em;
      align-items: center;
    }
    .player-controls button {
      background: #00dcff;
      color: #23203a;
      border: none;
      border-radius: 50%;
      width: 26px; height: 26px;
      font-size: 1em;
      cursor: pointer;
      border: 1.2px solid #ffdf2a;
      transition: background .18s, color .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }
    .player-controls button:active, .player-controls button:focus {
      background: #ffdf2a;
      color: #00dcff;
    }
    .player-volume-group {
      display: flex;
      align-items: center;
      gap: 0.13em;
    }
    .player-volume {
      background: #fff0;
      border-radius: 4px;
      padding: 2px 7px;
      display: flex;
      align-items: center;
      gap: 0.1em;
      color: #00dcff;
      font-size: 1em;
      min-height: 20px;
    }
    .player-volume input[type="range"] {
      width: 40px;
      accent-color: #30d191;
      margin-left: 2px;
    }
    /* Nota historial animada */
    .player-history-note {
      display: flex;
      align-items: center;
      gap: 0.2em;
      background: #fafdff;
      color: #ff72b5;
      border-radius: 0.7em;
      font-size: 0.97em;
      padding: 3px 8px 3px 7px;
      margin: 0.3em auto 0.1em auto;
      font-weight: 700;
      box-shadow: none;
      border: 1px solid #ffdf2a;
      animation: none;
      cursor: pointer;
      position: relative;
      transition: background 0.18s, color 0.18s;
      user-select: none;
      justify-content:center;
      width: fit-content;
    }
    .player-history-note .note-emoji {
      font-size: 1.1em;
      animation: none;
      display: inline-block;
    }
    /* Modal historial canción */
    .modal-bg {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.65);
      align-items: center;
      justify-content: center;
    }
    .modal-bg.active { display: flex; }
    .modal-content {
      background: #111d;
      color: #fff;
      border-radius: 0.8em;
      padding: 14px 6px 6px 6px;
      max-width: 250px;
      width: 98vw;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 22px #000a;
      font-family: 'Contrail One', Arial, sans-serif;
      animation: modalIn .2s;
    }
    @keyframes modalIn { from { transform:scale(0.88); opacity:0; } to { transform:scale(1); opacity:1; } }
    .modal-close {
      position: absolute; right: 7px; top: 7px; font-size: 1.1em;
      background: none; color: #fff; border: none; cursor: pointer;
    }
    .modal-album {
      margin: 7px auto 7px auto;
      border-radius: 7px;
      width: 48px; height: 48px;
      object-fit: cover;
      box-shadow:0 1.5px 6px #000a;
    }
    .modal-label {
      font-size:0.92em; margin-top: 7px; color: #ffdf2a;
    }
    .modal-history-list {
      text-align: left;
      margin: 4px 0 0 0;
      padding: 0;
      list-style: none;
    }
    .modal-history-list li {
      margin: 2.5px 0;
      font-size: 0.90em;
      border-bottom: 1px solid #fff2;
      padding-bottom: 2px;
      color: #fffbe8;
      text-shadow: 0 1px 3px #000a;
    }
    /* Responsive */
    @media (max-width:470px), (max-height:470px) {
      .kusfm-player { max-width: 99vw; font-size: 0.90em;}
      .player-avatar-wrap,
      .player-avatar-img { width: 42px; height: 54px;}
      .main-title-artist { font-size: 0.93em; padding:3px 4px 3px 4px;}
      .modal-content { max-width: 99vw; padding: 8px 2px 4px 2px;}
    }
  </style>
</head>
<body>
  <div class="kusfm-player">
    <!-- Iconos de verano ocultos por CSS compacto -->
    <img class="verano-sun" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="Sol verano" />
    <img class="verano-palm" src="https://cdn-icons-png.flaticon.com/512/619/619034.png" alt="Palmera verano" />

    <div class="player-rowflex">
      <div class="player-avatar-wrap">
        <div class="player-avatar-bg"></div>
        <div class="player-avatar-disco"></div>
        <img
          id="player-dj-avatar"
          class="player-avatar-img"
          src="https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&gesture=std&action=std&direction=2&head_direction=2&headonly=0"
          alt="DJ Avatar"
        />
      </div>
      <div class="player-maininfo">
        <div class="main-title-artist" id="main-title-artist">
          <span id="main-song-marquee">Cargando canción...</span>
        </div>
        <div class="main-dj" id="main-dj-name">DJ: ...</div>
        <div class="main-listeners"><span id="main-listeners">0</span> oyentes</div>
      </div>
    </div>

    <div class="player-controls-row">
      <div class="player-controls">
        <button id="player-play" title="Reproducir">&#9654;</button>
        <button id="player-pause" title="Pausar">&#10073;&#10073;</button>
        <button id="player-mute" title="Mute">&#128263;</button>
        <button id="player-reload" title="Recargar">&#x21bb;</button>
      </div>
      <div class="player-volume-group">
        <div class="player-volume" title="Volumen">
          <span>&#128266;</span>
          <input id="player-volume-slider" type="range" min="0" max="100" value="80"/>
        </div>
      </div>
    </div>

    <!-- Nota historial animada -->
    <div class="player-history-note" id="player-history-note" title="Ver historial de canciones">
      <span class="note-emoji">&#127925;</span>
      <span>Historial</span>
      <span class="note-emoji">&#127926;</span>
    </div>

    <audio id="player-audio" src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" preload="none"></audio>
  </div>

  <!-- Modal historial -->
  <div class="modal-bg" id="player-history-modal">
    <div class="modal-content">
      <button class="modal-close" id="player-history-close" title="Cerrar">&times;</button>
      <img src="" class="modal-album" id="modal-album-art" alt="Portada álbum" style="display:none;">
      <div class="modal-label">Tema actual</div>
      <div id="modal-current-song" style="font-size:1.01em; margin:5px 0 9px 0;"></div>
      <div class="modal-label">Últimos 4 temas</div>
      <ul class="modal-history-list" id="modal-song-history"></ul>
    </div>
  </div>
  <script>
    // --- Configuración ---
    const API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';
    function getHabboAvatar(username) {
      return `https://www.habbo.es/habbo-imaging/avatarimage?user=${encodeURIComponent(username)}&gesture=std&action=std&direction=2&head_direction=2&headonly=0`;
    }
    // --- Actualizar player principal y modal ---
    function updatePlayer() {
      fetch(API_NOWPLAYING_URL)
        .then(r => r.json())
        .then(data => {
          const song = data.now_playing.song;
          const live = data.live;
          const listeners = data.listeners.current;
          const artist = song.artist || "Desconocido";
          const title = song.title || "Desconocido";
          document.getElementById('main-song-marquee').textContent = `${artist} - ${title}`;
          // DJ info
          let nombreDj;
          if (live && live.is_live && live.streamer_name) {
            nombreDj = live.streamer_name;
            document.getElementById('player-dj-avatar').src = getHabboAvatar(nombreDj);
          } else {
            nombreDj = "estacionkusfm";
            document.getElementById('player-dj-avatar').src = getHabboAvatar("estacionkusfm");
          }
          document.getElementById('main-dj-name').textContent = "DJ: " + nombreDj;
          // Oyentes
          document.getElementById('main-listeners').textContent = listeners !== undefined ? listeners : "0";
          // Modal historial
          window.playerModalData = {
            albumArt: song.art || "",
            current: `${artist} - ${title}`,
            history: (data.song_history || []).slice(0, 4).map(s => `${s.song.artist} - ${s.song.title}`)
          };
        })
        .catch(() => {
          document.getElementById('main-song-marquee').textContent = "";
          document.getElementById('main-dj-name').textContent = "DJ: ...";
          document.getElementById('player-dj-avatar').src = getHabboAvatar("estacionkusfm");
          document.getElementById('main-listeners').textContent = "0";
          window.playerModalData = { albumArt: "", current: "", history: [] };
        });
    }
    // --- Controles de audio ---
    function setupPlayerControls() {
      const audio = document.getElementById('player-audio');
      document.getElementById('player-play').onclick = () => audio.play();
      document.getElementById('player-pause').onclick = () => audio.pause();
      document.getElementById('player-mute').onclick = () => audio.muted = !audio.muted;
      document.getElementById('player-reload').onclick = () => {
        audio.pause();
        audio.src = audio.src.split('?')[0] + '?t=' + Date.now();
        audio.load();
        audio.play();
      };
      const volume = document.getElementById('player-volume-slider');
      audio.volume = volume.value / 100;
      volume.addEventListener('input', () => { audio.volume = volume.value / 100; });
    }
    // --- Historial Modal ---
    function setupHistoryModal() {
      const modal = document.getElementById('player-history-modal');
      const noteBtn = document.getElementById('player-history-note');
      const modalClose = document.getElementById('player-history-close');
      const modalAlbum = document.getElementById('modal-album-art');
      const modalCurrent = document.getElementById('modal-current-song');
      const modalHistory = document.getElementById('modal-song-history');
      function openModal() {
        let d = window.playerModalData || {};
        if (d.albumArt) {
          modalAlbum.src = d.albumArt;
          modalAlbum.style.display = '';
        } else {
          modalAlbum.style.display = 'none';
        }
        modalCurrent.textContent = d.current || '';
        modalHistory.innerHTML = "";
        (d.history || []).forEach(t => {
          let li = document.createElement("li");
          li.textContent = t;
          modalHistory.appendChild(li);
        });
        modal.classList.add('active');
      }
      noteBtn.onclick = openModal;
      modalClose.onclick = () => modal.classList.remove('active');
      modal.onclick = e => { if (e.target === modal) modal.classList.remove('active'); };
      window.addEventListener('keydown', e => { if (e.key === "Escape") modal.classList.remove('active'); });
    }
    // --- Inicialización ---
    window.addEventListener("load", () => {
      updatePlayer();
      setupPlayerControls();
      setupHistoryModal();
      setInterval(updatePlayer, 5000);
    });
  </script>
</body>
</html>
