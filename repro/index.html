 <html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KUSFM Player Compacto Verano v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #e5fff9;
      margin: 0;
      padding: 0;
      font-family: 'Contrail One', Arial, sans-serif;
    }
    /* Background image container */
    .player-bg-container {
      position: relative;
      border-radius: 0.5em;
      overflow: hidden;
      max-width: 410px;
      min-width: 210px;
      margin: 1.5rem auto;
      box-shadow: 0 8px 20px rgb(0 220 255 / 0.4);
      border: 2px solid #00dcff;
      background: #fff;
    }
    .player-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.85) saturate(1.1);
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    .kusfm-player {
      position: relative;
      z-index: 10;
      padding: 0.75rem 1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(255 255 255 / 0.85);
      border-radius: 0.5em;
      box-shadow: 0 0 12px rgb(0 220 255 / 0.3);
      min-height: 160px;
      width: 100%;
      max-width: 410px;
      min-width: 210px;
    }
    /* Elimina adornos de verano */
    .verano-sun,
    .verano-palm {
      display: none !important;
    }
    /* Avatar */
    .player-avatar-wrap {
      position: relative;
      width: 70px;
      min-width: 70px;
      height: 90px;
      border-radius: 10px;
      overflow: visible;
      background: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 0.1em;
      margin-right: 10px;
      flex-shrink: 0;
      box-shadow: 0 0 8px #30d191aa;
      transition: box-shadow 0.3s ease;
    }
    .player-avatar-wrap:hover {
      box-shadow: 0 0 14px #00dcffcc;
    }
    .player-avatar-bg,
    .player-avatar-disco {
      display: none;
    }
    .player-avatar-img {
      width: 65px;
      height: 86px;
      object-fit: contain;
      object-position: bottom center;
      border-radius: 8px;
      background: #fff;
      border: 2px solid #fff;
      box-shadow: 0 1.5px 4px #30d19166;
      position: relative;
      z-index: 3;
      display: block;
      margin-left: 2px;
      margin-top: 2px;
      transition: transform 0.3s ease;
    }
    .player-avatar-wrap:hover .player-avatar-img {
      transform: scale(1.05);
    }
    /* Info principal de canción */
    .player-maininfo {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      margin-top: 0.1em;
    }
    .main-title-artist {
      font-size: 1.1em;
      color: #23203a;
      font-weight: 700;
      background: #f3f8fa;
      border-radius: 0.5rem;
      padding: 0.4rem 0.75rem 0.4rem 0.75rem;
      margin-bottom: 0.1em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.3em;
      min-height: 1.6em;
      box-shadow: none;
      text-shadow: none;
      user-select: text;
    }
    .main-dj {
      color: #ff72b5;
      font-size: 1em;
      font-weight: 600;
      background: transparent;
      border-radius: 0.375rem;
      padding: 0.15rem 0.75rem;
      margin-bottom: 0.05em;
      margin-top: 2px;
      text-shadow: none;
      user-select: text;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .main-listeners {
      color: #00dcff;
      background: transparent;
      font-size: 1em;
      border-radius: 0.375rem;
      padding: 0.15rem 0.75rem;
      margin-bottom: 0.01em;
      font-weight: 600;
      user-select: text;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    /* Flex fila */
    .player-rowflex {
      display: flex;
      align-items: flex-start;
      width: 100%;
      gap: 0.5rem;
      margin-bottom: 0.15em;
      margin-top: 0.15em;
    }
    /* Controles */
    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.5rem 0 0.15rem 0;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .player-controls {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }
    .player-controls button {
      background: #00dcff;
      color: #23203a;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.2em;
      cursor: pointer;
      border: 1.5px solid #ffdf2a;
      transition: background 0.18s, color 0.18s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgb(0 220 255 / 0.5);
    }
    .player-controls button:active,
    .player-controls button:focus {
      background: #ffdf2a;
      color: #00dcff;
      outline: none;
      transform: scale(0.9);
    }
    .player-controls button:hover {
      box-shadow: 0 0 12px #ffdf2a;
    }
    .player-volume-group {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      min-width: 120px;
      justify-content: center;
    }
    .player-volume {
      background: transparent;
      border-radius: 0.375rem;
      padding: 0.2rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.3em;
      color: #00dcff;
      font-size: 1.2em;
      min-height: 24px;
      user-select: none;
    }
    .player-volume input[type='range'] {
      width: 70px;
      accent-color: #30d191;
      margin-left: 4px;
      cursor: pointer;
      height: 6px;
      border-radius: 4px;
      background: #cceff7;
      -webkit-appearance: none;
    }
    .player-volume input[type='range']::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #30d191;
      cursor: pointer;
      border-radius: 50%;
      border: 1.5px solid #00dcff;
      transition: background 0.2s ease;
      margin-top: -5px;
    }
    .player-volume input[type='range']::-webkit-slider-thumb:hover {
      background: #00dcff;
    }
    .player-volume input[type='range']::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #30d191;
      cursor: pointer;
      border-radius: 50%;
      border: 1.5px solid #00dcff;
      transition: background 0.2s ease;
    }
    .player-volume input[type='range']::-moz-range-thumb:hover {
      background: #00dcff;
    }
    /* Nota historial animada */
    .player-history-note {
      display: flex;
      align-items: center;
      gap: 0.3em;
      background: #fafdff;
      color: #ff72b5;
      border-radius: 1em;
      font-size: 1.05em;
      padding: 0.4em 1.1em 0.4em 1.1em;
      margin: 0.5em auto 0.3em auto;
      font-weight: 700;
      box-shadow: 0 0 8px #ff72b5aa;
      border: 2px solid #ffdf2a;
      cursor: pointer;
      position: relative;
      transition: background 0.18s, color 0.18s, box-shadow 0.3s;
      user-select: none;
      justify-content: center;
      width: fit-content;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-history-note:hover {
      background: #ffdf2a;
      color: #00dcff;
      box-shadow: 0 0 14px #ffdf2a;
    }
    .player-history-note .note-emoji {
      font-size: 1.3em;
      animation: none;
      display: inline-block;
      user-select: none;
    }
    /* Modal historial canción */
    .modal-bg {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-bg.active {
      display: flex;
    }
    .modal-content {
      background: #111d;
      color: #fff;
      border-radius: 1rem;
      padding: 1rem 1rem 1.2rem 1rem;
      max-width: 320px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 22px #000a;
      font-family: 'Contrail One', Arial, sans-serif;
      animation: modalIn 0.2s ease forwards;
      user-select: text;
    }
    @keyframes modalIn {
      from {
        transform: scale(0.88);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    .modal-close {
      position: absolute;
      right: 12px;
      top: 12px;
      font-size: 1.4em;
      background: none;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: color 0.2s ease;
      user-select: none;
    }
    .modal-close:hover {
      color: #ffdf2a;
    }
    .modal-album {
      margin: 0.5rem auto 0.7rem auto;
      border-radius: 0.75rem;
      width: 56px;
      height: 56px;
      object-fit: cover;
      box-shadow: 0 2px 10px #000a;
      user-select: none;
    }
    .modal-label {
      font-size: 1em;
      margin-top: 0.6rem;
      color: #ffdf2a;
      font-weight: 700;
      user-select: none;
    }
    .modal-history-list {
      text-align: left;
      margin: 0.5rem 0 0 0;
      padding: 0;
      list-style: none;
      max-height: 160px;
      overflow-y: auto;
      user-select: text;
    }
    .modal-history-list li {
      margin: 0.3rem 0;
      font-size: 0.95em;
      border-bottom: 1px solid #fff2;
      padding-bottom: 0.25rem;
      color: #fffbe8;
      text-shadow: 0 1px 3px #000a;
      word-break: break-word;
    }
    /* Scrollbar for modal history */
    .modal-history-list::-webkit-scrollbar {
      width: 6px;
    }
    .modal-history-list::-webkit-scrollbar-thumb {
      background-color: #00dcffaa;
      border-radius: 3px;
    }
    /* Responsive */
    @media (max-width: 470px), (max-height: 470px) {
      .player-bg-container {
        max-width: 99vw;
        min-width: 180px;
      }
      .kusfm-player {
        font-size: 0.9em;
        min-height: 140px;
        padding: 0.5rem 0.75rem 0.75rem 0.75rem;
      }
      .player-avatar-wrap,
      .player-avatar-img {
        width: 48px;
        height: 62px;
      }
      .main-title-artist {
        font-size: 1em;
        padding: 0.25rem 0.5rem 0.25rem 0.5rem;
      }
      .main-dj,
      .main-listeners {
        font-size: 0.9em;
        padding: 0.1rem 0.5rem;
      }
      .modal-content {
        max-width: 99vw;
        padding: 0.5rem 0.5rem 0.75rem 0.5rem;
      }
      .modal-album {
        width: 44px;
        height: 44px;
      }
      .player-controls button {
        width: 28px;
        height: 28px;
        font-size: 1em;
      }
      .player-volume input[type='range'] {
        width: 55px;
      }
      .player-history-note {
        font-size: 0.95em;
        padding: 0.3em 0.8em;
      }
    }
    /* New icon-only controls container */
    .icon-controls {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 0.6rem;
      user-select: none;
    }
    .icon-controls button {
      background: #00dcff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      color: #23203a;
      font-size: 1.4em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgb(0 220 255 / 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .icon-controls button:hover {
      background: #ffdf2a;
      color: #00dcff;
      box-shadow: 0 0 14px #ffdf2a;
      transform: scale(1.1);
    }
    .icon-controls button:active,
    .icon-controls button:focus {
      background: #ffdf2a;
      color: #00dcff;
      outline: none;
      transform: scale(0.9);
    }
    /* Icon-only history button */
    .icon-history {
      background: #fafdff;
      border: 2px solid #ffdf2a;
      color: #ff72b5;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.5em;
      cursor: pointer;
      box-shadow: 0 0 8px #ff72b5aa;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.8rem auto 0 auto;
      transition: background 0.18s, color 0.18s, box-shadow 0.3s, transform 0.15s;
      user-select: none;
    }
    .icon-history:hover {
      background: #ffdf2a;
      color: #00dcff;
      box-shadow: 0 0 14px #ffdf2a;
      transform: scale(1.1);
    }
    .icon-history:active,
    .icon-history:focus {
      background: #ffdf2a;
      color: #00dcff;
      outline: none;
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div class="player-bg-container" role="region" aria-label="Reproductor de radio KUSFM">
    <img
      src="https://images.habbo.com/c_images/article_images_hq/article_summer2011_newclothes.gif"
      alt="Fondo animado de verano con personajes de Habbo vestidos con ropa de verano, palmeras y sol brillante"
      class="player-bg-image"
      aria-hidden="true"
    />
    <div class="kusfm-player">
      <img class="verano-sun" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="Sol verano" />
      <img class="verano-palm" src="https://cdn-icons-png.flaticon.com/512/619/619034.png" alt="Palmera verano" />

      <div class="player-rowflex">
        <div class="player-avatar-wrap" aria-label="Avatar del DJ">
          <div class="player-avatar-bg"></div>
          <div class="player-avatar-disco"></div>
          <img
            id="player-dj-avatar"
            class="player-avatar-img"
            src="https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&gesture=std&action=std&direction=2&head_direction=2&headonly=0"
            alt="Avatar del DJ en estilo pixel art de Habbo"
            loading="lazy"
          />
        </div>
        <div class="player-maininfo">
          <div class="main-title-artist" id="main-title-artist" aria-live="polite" aria-atomic="true" aria-relevant="text">
            <span id="main-song-marquee">Cargando canción...</span>
          </div>
          <div class="main-dj" id="main-dj-name" aria-live="polite" aria-atomic="true">DJ: ...</div>
          <div class="main-listeners" aria-live="polite" aria-atomic="true">
            <span id="main-listeners">0</span> oyentes
          </div>
        </div>
      </div>

      <!-- Original controls hidden on small screens -->
      <div class="player-controls-row md:flex hidden" role="group" aria-label="Controles de reproducción">
        <div class="player-controls">
          <button id="player-play" title="Reproducir" aria-label="Reproducir"><i class="fas fa-play"></i></button>
          <button id="player-pause" title="Pausar" aria-label="Pausar"><i class="fas fa-pause"></i></button>
          <button id="player-mute" title="Silenciar" aria-label="Silenciar / Activar sonido"><i class="fas fa-volume-mute"></i></button>
          <button id="player-reload" title="Recargar" aria-label="Recargar transmisión"><i class="fas fa-redo"></i></button>
        </div>
        <div class="player-volume-group" aria-label="Control de volumen">
          <div class="player-volume" title="Volumen">
            <span aria-hidden="true"><i class="fas fa-volume-up"></i></span>
            <input
              id="player-volume-slider"
              type="range"
              min="0"
              max="100"
              value="80"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="80"
              aria-label="Control de volumen"
            />
          </div>
        </div>
      </div>

      <!-- New icon-only controls for small screens -->
      <div class="icon-controls md:hidden" role="group" aria-label="Controles de reproducción compactos">
        <button id="icon-play" title="Reproducir" aria-label="Reproducir"><i class="fas fa-play"></i></button>
        <button id="icon-pause" title="Pausar" aria-label="Pausar"><i class="fas fa-pause"></i></button>
        <button id="icon-mute" title="Silenciar" aria-label="Silenciar / Activar sonido"><i class="fas fa-volume-mute"></i></button>
        <button id="icon-reload" title="Recargar" aria-label="Recargar transmisión"><i class="fas fa-redo"></i></button>
        <button id="icon-shuffle" title="Reproducir aleatorio" aria-label="Reproducir aleatorio"><i class="fas fa-random"></i></button>
      </div>

      <!-- Icon-only history button -->
      <button
        class="icon-history"
        id="icon-history"
        title="Ver historial de canciones"
        aria-label="Abrir historial de canciones"
        aria-pressed="false"
        role="button"
        tabindex="0"
      >
        <i class="fas fa-history"></i>
      </button>

      <audio id="player-audio" src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" preload="none"></audio>
    </div>
  </div>

  <!-- Modal historial -->
  <div class="modal-bg" id="player-history-modal" role="dialog" aria-modal="true" aria-labelledby="modal-label-current" aria-describedby="modal-description">
    <div class="modal-content">
      <button class="modal-close" id="player-history-close" title="Cerrar" aria-label="Cerrar historial">&times;</button>
      <img src="" class="modal-album" id="modal-album-art" alt="Portada del álbum de la canción actual" style="display:none;" loading="lazy" />
      <div class="modal-label" id="modal-label-current">Tema actual</div>
      <div id="modal-current-song" style="font-size:1.01em; margin:5px 0 9px 0;"></div>
      <div class="modal-label">Últimos 4 temas</div>
      <ul class="modal-history-list" id="modal-song-history"></ul>
    </div>
  </div>

  <script>
    // --- Configuración ---
    const API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';
    function getHabboAvatar(username) {
      return `https://www.habbo.es/habbo-imaging/avatarimage?user=${encodeURIComponent(username)}&gesture=std&action=std&direction=2&head_direction=2&headonly=0`;
    }
    // --- Actualizar player principal y modal ---
    function updatePlayer() {
      fetch(API_NOWPLAYING_URL)
        .then((r) => r.json())
        .then((data) => {
          const song = data.now_playing.song;
          const live = data.live;
          const listeners = data.listeners.current;
          const artist = song.artist || 'Desconocido';
          const title = song.title || 'Desconocido';
          document.getElementById('main-song-marquee').textContent = `${artist} - ${title}`;
          // DJ info
          let nombreDj;
          if (live && live.is_live && live.streamer_name) {
            nombreDj = live.streamer_name;
            document.getElementById('player-dj-avatar').src = getHabboAvatar(nombreDj);
          } else {
            nombreDj = 'estacionkusfm';
            document.getElementById('player-dj-avatar').src = getHabboAvatar('estacionkusfm');
          }
          document.getElementById('main-dj-name').textContent = 'DJ: ' + nombreDj;
          // Oyentes
          document.getElementById('main-listeners').textContent = listeners !== undefined ? listeners : '0';
          // Modal historial
          window.playerModalData = {
            albumArt: song.art || '',
            current: `${artist} - ${title}`,
            history: (data.song_history || [])
              .slice(0, 4)
              .map((s) => `${s.song.artist} - ${s.song.title}`),
          };
        })
        .catch(() => {
          document.getElementById('main-song-marquee').textContent = '';
          document.getElementById('main-dj-name').textContent = 'DJ: ...';
          document.getElementById('player-dj-avatar').src = getHabboAvatar('estacionkusfm');
          document.getElementById('main-listeners').textContent = '0';
          window.playerModalData = { albumArt: '', current: '', history: [] };
        });
    }
    // --- Controles de audio ---
    function setupPlayerControls() {
      const audio = document.getElementById('player-audio');
      const muteBtn = document.getElementById('player-mute');
      const volumeSlider = document.getElementById('player-volume-slider');

      // Original controls
      document.getElementById('player-play').onclick = () => audio.play();
      document.getElementById('player-pause').onclick = () => audio.pause();
      document.getElementById('player-reload').onclick = () => {
        audio.pause();
        audio.src = audio.src.split('?')[0] + '?t=' + Date.now();
        audio.load();
        audio.play();
      };

      muteBtn.onclick = () => {
        audio.muted = !audio.muted;
        updateMuteIcon();
      };

      volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value / 100;
        if (audio.volume === 0) {
          audio.muted = true;
        } else {
          audio.muted = false;
        }
        updateMuteIcon();
      });

      audio.volume = volumeSlider.value / 100;
      updateMuteIcon();

      function updateMuteIcon() {
        if (audio.muted || audio.volume === 0) {
          muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
          muteBtn.setAttribute('aria-label', 'Activar sonido');
        } else {
          muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
          muteBtn.setAttribute('aria-label', 'Silenciar');
        }
      }

      // New icon-only controls
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const iconMute = document.getElementById('icon-mute');
      const iconReload = document.getElementById('icon-reload');
      const iconShuffle = document.getElementById('icon-shuffle');

      iconPlay.onclick = () => audio.play();
      iconPause.onclick = () => audio.pause();
      iconReload.onclick = () => {
        audio.pause();
        audio.src = audio.src.split('?')[0] + '?t=' + Date.now();
        audio.load();
        audio.play();
      };
      iconMute.onclick = () => {
        audio.muted = !audio.muted;
        updateIconMuteIcon();
      };

      iconShuffle.onclick = () => {
        // Shuffle function: simulate random seek within stream duration if possible
        // Since it's a live stream, we simulate by reloading with random timestamp param
        audio.pause();
        const randomSeed = Math.floor(Math.random() * 100000);
        audio.src = audio.src.split('?')[0] + '?t=' + Date.now() + '&r=' + randomSeed;
        audio.load();
        audio.play();
      };

      function updateIconMuteIcon() {
        if (audio.muted || audio.volume === 0) {
          iconMute.innerHTML = '<i class="fas fa-volume-mute"></i>';
          iconMute.setAttribute('aria-label', 'Activar sonido');
        } else {
          iconMute.innerHTML = '<i class="fas fa-volume-up"></i>';
          iconMute.setAttribute('aria-label', 'Silenciar');
        }
      }
      updateIconMuteIcon();
    }
    // --- Historial Modal ---
    function setupHistoryModal() {
      const modal = document.getElementById('player-history-modal');
      const noteBtn = document.getElementById('player-history-note');
      const modalClose = document.getElementById('player-history-close');
      const modalAlbum = document.getElementById('modal-album-art');
      const modalCurrent = document.getElementById('modal-current-song');
      const modalHistory = document.getElementById('modal-song-history');
      const iconHistoryBtn = document.getElementById('icon-history');

      function openModal() {
        let d = window.playerModalData || {};
        if (d.albumArt) {
          modalAlbum.src = d.albumArt;
          modalAlbum.style.display = '';
        } else {
          modalAlbum.style.display = 'none';
        }
        modalCurrent.textContent = d.current || '';
        modalHistory.innerHTML = '';
        (d.history || []).forEach((t) => {
          let li = document.createElement('li');
          li.textContent = t;
          modalHistory.appendChild(li);
        });
        modal.classList.add('active');
        noteBtn?.setAttribute('aria-pressed', 'true');
        iconHistoryBtn?.setAttribute('aria-pressed', 'true');
        // Focus modal close button for accessibility
        modalClose.focus();
      }
      noteBtn?.addEventListener('click', openModal);
      noteBtn?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal();
        }
      });
      iconHistoryBtn?.addEventListener('click', openModal);
      iconHistoryBtn?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal();
        }
      });

      modalClose.onclick = () => {
        modal.classList.remove('active');
        noteBtn?.setAttribute('aria-pressed', 'false');
        iconHistoryBtn?.setAttribute('aria-pressed', 'false');
        noteBtn?.focus();
      };
      modal.onclick = (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          noteBtn?.setAttribute('aria-pressed', 'false');
          iconHistoryBtn?.setAttribute('aria-pressed', 'false');
          noteBtn?.focus();
        }
      };
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          modal.classList.remove('active');
          noteBtn?.setAttribute('aria-pressed', 'false');
          iconHistoryBtn?.setAttribute('aria-pressed', 'false');
          noteBtn?.focus();
        }
      });
    }
    // --- Inicialización ---
    window.addEventListener('load', () => {
      updatePlayer();
      setupPlayerControls();
      setupHistoryModal();
      setInterval(updatePlayer, 5000);
    });
  </script>
</body>
</html>
