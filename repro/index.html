<!DOCTYPE html>
<html lang="es">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Reproductor</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<link rel="stylesheet" href="player.css">
<link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
</head>
<body>
<div id="reproductor">
    <div class="cover">
        <img src="#" id="dj_avatar" class="ball" onerror="validarAvatar()"/>
    </div>
    <div class="area-botones" style="font-size:14px;">
        <div class="section">
            <div id="djactual" style="font-weight:bold;">
                <i class="fas fa-microphone iconos" style="margin-right:10px;"></i>
                <span id="name_dj" class="cc_streaminfo" style="color:#ffdf2a;"></span>
            </div>
        </div>
        <div class="section">
            <i class="fas fa-headphones iconos" style="margin-right:10px;"></i>
            <marquee id="cancion" scrolldelay="200">
                <span class="cc_streaminfo" style="color:#00dcff;" id="song_title"></span>
            </marquee>
        </div>
        <div class="section">
            <i class="fas fa-user-friends iconos icooyente" style="margin-right:10px;"></i>
            <div id="autor">
                <span class="cc_streaminfo" style="color:#ffdf2a;" id="listeners"></span> oyentes
            </div>
        </div>
        <div class="section separacion">
            <div id="player">
                <div id="volume"><small><a target="_self" href="#">Actualizar reproductor</a></small></div>
            </div>
        </div>
    </div>
    <div class="area-play">
        <!-- BEGINS: AUTO-GENERATED MUSES RADIO PLAYER CODE -->
        <script type="text/javascript" src="https://hosted.muses.org/mrp.js"></script>
        <script type="text/javascript">
            MRP.insert({
                'url':'https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3',
                'codec':'mp3',
                'volume':100,
                'autoplay':true,
                'jsevents':true,
                'buffering':0,
                'title':'estacionkusfm',
                'welcome':'BIENVENIDO A...',
                'wmode':'transparent',
                'skin':'abrahadabra2',
                'width':100,
                'height':140
            });
        </script>
        <!-- ENDS: AUTO-GENERATED MUSES RADIO PLAYER CODE -->
    </div>
</div>

<script language="javascript" type="text/javascript">
    const API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';

    function validarAvatar(){
        $("#dj_avatar").css('display','none');
        console.clear();
    }

    $(function(){
        function updateInfo() {
            $.ajax({
                url: API_NOWPLAYING_URL,
                success: function(data) {
                    const song = data.now_playing.song;
                    const listeners = data.listeners.current;
                    const live = data.live;

                    // Song & artist
                    $("#song_title").text(
                        (song.artist ? song.artist : "Desconocido") + " - " + (song.title ? song.title : "Desconocido")
                    );

                    // Si hay DJ en vivo usamos el nombre y avatar Habbo del streamer
                    if (live && live.is_live && live.streamer_name) {
                        $("#name_dj").text(live.streamer_name);
                        $("#dj_avatar").attr(
                            "src",
                            "https://www.habbo.es/habbo-imaging/avatarimage?user=" +
                            encodeURIComponent(live.streamer_name) +
                            "&action=wav,drk=08&direction=2&head_direction=2&img_format=gif&gesture=sml&headonly=1"
                        ).css('display','block');
                    } else {
                        // No hay DJ en vivo: avatar Habbo de estacionkusfm
                        $("#name_dj").text("AutoDJ");
                        $("#dj_avatar").attr(
                            "src",
                            "https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&action=wav,drk=08&direction=2&head_direction=2&img_format=gif&gesture=sml&headonly=1"
                        ).css('display','block');
                    }

                    // Listeners
                    $("#listeners").text(listeners !== undefined ? listeners : "0");
                },
                error: function() {
                    $("#song_title").text("Error al cargar");
                    $("#name_dj").text("");
                    $("#listeners").text("0");
                    $("#dj_avatar").attr(
                        "src",
                        "https://www.habbo.es/habbo-imaging/avatarimage?user=estacionkusfm&action=wav,drk=08&direction=2&head_direction=2&img_format=gif&gesture=sml&headonly=1"
                    ).css('display','block');
                }
            });
        }
        updateInfo();
        setInterval(updateInfo, 5000); // Actualiza cada 5 segundos
    });
</script>

<script src="https://code.jquery.com/jquery-2.2.4.js" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script defer src="https://use.fontawesome.com/releases/v5.8.1/js/all.js" crossorigin="anonymous"></script>
</body>
</html>
