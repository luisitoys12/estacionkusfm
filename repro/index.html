<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Reproductor</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<link rel="stylesheet" href="player.css">
<link href="https://fonts.googleapis.com/css2?family=Contrail+One&display=swap" rel="stylesheet">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<style>
/* Estilos del reproductor y su caja, ver player.css para el resto */
.player-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin-top: 10px;
    margin-bottom: 10px;
}
.player-btn {
    background: #00dcff;
    color: #23203a;
    border: none;
    outline: none;
    border-radius: 50%;
    width: 43px;
    height: 43px;
    font-size: 1.5rem;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background .18s;
    box-shadow: 0 2px 10px #0003;
    cursor: pointer;
}
.player-btn:active, .player-btn:focus {
    background: #ffdf2a;
    color: #23203a;
}
.player-btn[disabled] {
    opacity: 0.55;
    pointer-events: none;
}
.player-controls .reload-btn {
    background: #ffdf2a;
    color: #23203a;
    font-size: 1.35rem;
}
.player-slider {
    width: 120px;
    margin-left: 7px;
    margin-right: 7px;
}
.player-volume {
    display: flex;
    align-items: center;
    margin-left: 8px;
}
.player-volume i {
    color: #00dcff;
    margin-right: 2px;
    font-size: 1.1rem;
}
@media (max-width: 480px) {
    .player-controls { gap: 11px; }
    .player-btn { width: 31px; height: 31px; font-size: 1.08rem;}
    .player-controls .reload-btn { font-size: 1.02rem;}
    .player-slider { width: 68px; }
}
</style>
</head>
<body>
<div id="reproductor">
    <div class="cover">
        <img src="https://cdn-icons-png.flaticon.com/512/619/619034.png" class="summer-effect" alt="Palmera verano"
             style="filter: drop-shadow(0 1px 3px #0007)">
        <div class="dj-container">
            <img src="#" id="dj_avatar" onerror="validarAvatar()"/>
            <img src="https://static.habbo-happy.net/img/furni/big/735778452353491.gif" class="dj-set" alt="Set DJ">
        </div>
        <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" class="summer-sun" alt="Sol verano">
    </div>
    <div class="meta-cards">
        <div class="meta-card">
            <span class="meta-icon"><i class="fas fa-microphone"></i></span>
            <div class="meta-info">
                <span class="meta-title">DJ actual</span>
                <span id="name_dj" class="meta-value cc_streaminfo" style="color:#ffdf2a;"></span>
            </div>
        </div>
        <div class="meta-card">
            <span class="meta-icon"><i class="fas fa-headphones"></i></span>
            <div class="meta-info">
                <span class="meta-title">Canción</span>
                <span class="meta-song cc_streaminfo" id="song_title"></span>
            </div>
        </div>
        <div class="meta-card">
            <span class="meta-icon"><i class="fas fa-user-friends"></i></span>
            <div class="meta-info">
                <span class="meta-title">Oyentes</span>
                <span class="meta-value cc_streaminfo" id="listeners"></span>
            </div>
        </div>
    </div>
    <div class="area-play">
        <!-- PLAYER NATIVO HTML5 PERSONALIZADO -->
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
            <audio id="custom-player" preload="none">
                <source src="https://radio.estacionkusmedios.com/listen/esmerosound/radio.mp3" type="audio/mpeg">
                Tu navegador no soporta audio HTML5.
            </audio>
            <div class="player-controls">
                <button class="player-btn reload-btn" id="btn-reload" title="Actualizar/Reiniciar">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="player-btn" id="btn-play" title="Reproducir">
                    <i class="fas fa-play"></i>
                </button>
                <button class="player-btn" id="btn-pause" title="Pausar">
                    <i class="fas fa-pause"></i>
                </button>
                <div class="player-volume">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" id="volume-slider" class="player-slider" min="0" max="100" value="100">
                </div>
            </div>
        </div>
    </div>
</div>

<script language="javascript" type="text/javascript">
    const API_NOWPLAYING_URL = 'https://radio.estacionkusmedios.com/api/nowplaying/esmerosound';

    function getHabboAvatarUrlByUser(username, {
        gesture = "srp",
        action = "wlk",
        direction = 4,
        head_direction = 2,
        headonly = 0
    } = {}) {
        return "https://www.habbo.es/habbo-imaging/avatarimage"
            + "?user=" + encodeURIComponent(username)
            + "&gesture=" + gesture
            + "&action=" + action
            + "&direction=" + direction
            + "&head_direction=" + head_direction
            + "&headonly=" + headonly;
    }

    function validarAvatar(){
        $("#dj_avatar").css('display','none');
        console.clear();
    }

    $(function(){
        function updateInfo() {
            $.ajax({
                url: API_NOWPLAYING_URL,
                success: function(data) {
                    const song = data.now_playing.song;
                    const listeners = data.listeners.current;
                    const live = data.live;
                    $("#song_title").text(
                        (song.artist ? song.artist : "Desconocido") + " - " + (song.title ? song.title : "Desconocido")
                    );
                    if (live && live.is_live && live.streamer_name) {
                        $("#name_dj").text(live.streamer_name);
                        $("#dj_avatar").attr(
                            "src",
                            getHabboAvatarUrlByUser(live.streamer_name, {
                                gesture: "srp",
                                action: "wlk",
                                direction: 4,
                                head_direction: 2,
                                headonly: 0
                            })
                        ).css('display','block');
                    } else {
                        $("#name_dj").text("AutoDJ");
                        $("#dj_avatar").attr(
                            "src",
                            getHabboAvatarUrlByUser("estacionkusfm", {
                                gesture: "srp",
                                action: "wlk",
                                direction: 4,
                                head_direction: 2,
                                headonly: 0
                            })
                        ).css('display','block');
                    }
                    $("#listeners").text(listeners !== undefined ? listeners : "0");
                },
                error: function() {
                    $("#song_title").text("Error al cargar");
                    $("#name_dj").text("");
                    $("#listeners").text("0");
                    $("#dj_avatar").attr(
                        "src",
                        getHabboAvatarUrlByUser("estacionkusfm", {
                            gesture: "srp",
                            action: "wlk",
                            direction: 4,
                            head_direction: 2,
                            headonly: 0
                        })
                    ).css('display','block');
                }
            });
        }
        updateInfo();
        setInterval(updateInfo, 5000); // Actualiza cada 5 segundos
    });

    // PLAYER CONTROLS
    $(function() {
        const audio = document.getElementById('custom-player');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnReload = document.getElementById('btn-reload');
        const slider = document.getElementById('volume-slider');

        btnPlay.onclick = function() {
            audio.play();
        };
        btnPause.onclick = function() {
            audio.pause();
        };
        btnReload.onclick = function() {
            audio.pause();
            // Forzar recarga de stream
            audio.src = audio.src.split('?')[0] + '?t=' + new Date().getTime();
            audio.load();
            audio.play();
        };
        slider.oninput = function() {
            audio.volume = slider.value / 100;
        };
        // Estado de botones dependiendo de si está playing o no
        function updateBtnState() {
            if (audio.paused) {
                btnPlay.disabled = false;
                btnPause.disabled = true;
            } else {
                btnPlay.disabled = true;
                btnPause.disabled = false;
            }
        }
        audio.addEventListener('play', updateBtnState);
        audio.addEventListener('pause', updateBtnState);
        audio.addEventListener('ended', updateBtnState);
        // Inicial
        updateBtnState();
    });
</script>
<script src="https://code.jquery.com/jquery-2.2.4.js" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script defer src="https://use.fontawesome.com/releases/v5.8.1/js/all.js" crossorigin="anonymous"></script>
</body>
</html>
